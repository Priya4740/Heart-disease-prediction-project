<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Heart Health AI</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {

            font-family: Arial, Helvetica, sans-serif;

            min-height: 100vh;

            background:
                linear-gradient(
                    135deg,
                    #dbeafe,
                    #ede9fe,
                    #fce7f3,
                    #cffafe
                );

            color: #1e293b;
        }


        /* NAVBAR */

        .navbar {

            background: rgba(255,255,255,0.96);

            padding: 18px 8%;

            display: flex;

            justify-content: space-between;

            align-items: center;

            box-shadow:
                0 4px 20px rgba(79,70,229,0.12);
        }


        .logo {

            font-size: 23px;

            font-weight: bold;

            color: #2563eb;
        }


        .badge {

            background: #ede9fe;

            color: #6d28d9;

            padding: 9px 16px;

            border-radius: 25px;

            font-size: 13px;

            font-weight: bold;
        }


        /* HERO */

        .hero {

            text-align: center;

            padding: 40px 20px 25px;
        }


        .heart-icon {

            font-size: 55px;

            margin-bottom: 12px;
        }


        .hero h1 {

            font-size: 38px;

            color: #312e81;

            margin-bottom: 10px;
        }


        .hero p {

            color: #64748b;

            font-size: 16px;

            line-height: 1.6;
        }


        /* CONTAINER */

        .container {

            width: 92%;

            max-width: 1000px;

            margin: 20px auto 50px;
        }


        /* CARD */

        .card {

            background: rgba(255,255,255,0.97);

            border-radius: 25px;

            padding: 38px;

            box-shadow:
                0 25px 60px rgba(79,70,229,0.15);
        }


        .section-title {

            font-size: 22px;

            font-weight: bold;

            color: #312e81;

            margin-bottom: 25px;
        }


        /* FORM */

        .form-grid {

            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 20px;
        }


        .form-group {

            display: flex;

            flex-direction: column;
        }


        label {

            font-size: 14px;

            font-weight: bold;

            color: #334155;

            margin-bottom: 8px;
        }


        input,
        select {

            width: 100%;

            padding: 13px 14px;

            border: 1px solid #cbd5e1;

            border-radius: 11px;

            background: #f8fafc;

            font-size: 14px;

            outline: none;
        }


        input:focus,
        select:focus {

            border-color: #6366f1;

            background: white;

            box-shadow:
                0 0 0 4px
                rgba(99,102,241,0.10);
        }


        /* BUTTON */

        .button-container {

            text-align: center;

            margin-top: 30px;
        }


        .predict-button {

            border: none;

            cursor: pointer;

            padding: 15px 45px;

            border-radius: 14px;

            color: white;

            font-size: 16px;

            font-weight: bold;

            background:
                linear-gradient(
                    135deg,
                    #2563eb,
                    #7c3aed,
                    #db2777
                );

            box-shadow:
                0 10px 25px
                rgba(79,70,229,0.25);

            transition: 0.25s;
        }


        .predict-button:hover {

            transform: translateY(-3px);

            box-shadow:
                0 15px 30px
                rgba(79,70,229,0.35);
        }


        /* FOOTER */

        .footer {

            text-align: center;

            color: #64748b;

            font-size: 13px;

            padding: 20px;
        }


        /* MOBILE */

        @media (max-width: 700px) {

            .form-grid {

                grid-template-columns: 1fr;
            }

            .hero h1 {

                font-size: 28px;
            }

            .card {

                padding: 25px 20px;
            }

            .navbar {

                padding: 15px 5%;
            }

            .predict-button {

                width: 100%;
            }
        }

    </style>

</head>


<body>


<!-- ======================================================
     NAVBAR
======================================================= -->

<nav class="navbar">

    <div class="logo">
        ❤️ Heart Health AI
    </div>

    <div class="badge">
        ML Risk Prediction
    </div>

</nav>


<!-- ======================================================
     HERO
======================================================= -->

<section class="hero">

    <div class="heart-icon">
        ❤️
    </div>

    <h1>
        Heart Disease Risk Prediction
    </h1>

    <p>
        Enter the patient information below to generate
        a machine learning risk prediction.
    </p>

</section>


<!-- ======================================================
     FORM
======================================================= -->

<div class="container">

    <div class="card">

        <div class="section-title">
            🩺 Patient Information
        </div>


        <form action="/predict" method="POST">


            <div class="form-grid">


                <!-- AGE -->

                <div class="form-group">

                    <label for="age">
                        Age
                    </label>

                    <input
                        type="number"
                        id="age"
                        name="age"
                        placeholder="e.g. 52"
                        required
                    >

                </div>


                <!-- SEX -->

                <div class="form-group">

                    <label for="sex">
                        Sex
                    </label>

                    <select
                        id="sex"
                        name="sex"
                        required
                    >

                        <option value="">
                            Select
                        </option>

                        <option value="Male">
                            Male
                        </option>

                        <option value="Female">
                            Female
                        </option>

                    </select>

                </div>


                <!-- CHEST PAIN -->

                <div class="form-group">

                    <label for="chest_pain_type">
                        Chest Pain Type
                    </label>

                    <select
                        id="chest_pain_type"
                        name="chest_pain_type"
                        required
                    >

                        <option value="">
                            Select
                        </option>

                        <option value="Typical angina">
                            Typical Angina
                        </option>

                        <option value="Atypical angina">
                            Atypical Angina
                        </option>

                        <option value="Non-anginal pain">
                            Non-anginal Pain
                        </option>

                        <option value="Asymptomatic">
                            Asymptomatic
                        </option>

                    </select>

                </div>


                <!-- BLOOD PRESSURE -->

                <div class="form-group">

                    <label for="resting_blood_pressure">
                        Resting Blood Pressure
                    </label>

                    <input
                        type="number"
                        id="resting_blood_pressure"
                        name="resting_blood_pressure"
                        placeholder="e.g. 120"
                        required
                    >

                </div>


                <!-- CHOLESTEROL -->

                <div class="form-group">

                    <label for="cholestoral">
                        Cholesterol
                    </label>

                    <input
                        type="number"
                        id="cholestoral"
                        name="cholestoral"
                        placeholder="e.g. 200"
                        required
                    >

                </div>


                <!-- FASTING BLOOD SUGAR -->

                <div class="form-group">

                    <label for="fasting_blood_sugar">
                        Fasting Blood Sugar
                    </label>

                    <select
                        id="fasting_blood_sugar"
                        name="fasting_blood_sugar"
                        required
                    >

                        <option value="">
                            Select
                        </option>

                        <option value="Lower than 120 mg/ml">
                            Lower than 120 mg/ml
                        </option>

                        <option value="Greater than 120 mg/ml">
                            Greater than 120 mg/ml
                        </option>

                    </select>

                </div>


                <!-- REST ECG -->

                <div class="form-group">

                    <label for="rest_ecg">
                        Resting ECG
                    </label>

                    <select
                        id="rest_ecg"
                        name="rest_ecg"
                        required
                    >

                        <option value="">
                            Select
                        </option>

                        <option value="Normal">
                            Normal
                        </option>

                        <option value="ST-T wave abnormality">
                            ST-T Wave Abnormality
                        </option>

                        <option value="Left ventricular hypertrophy">
                            Left Ventricular Hypertrophy
                        </option>

                    </select>

                </div>


                <!-- MAX HEART RATE -->

                <div class="form-group">

                    <label for="Max_heart_rate">
                        Maximum Heart Rate
                    </label>

                    <input
                        type="number"
                        id="Max_heart_rate"
                        name="Max_heart_rate"
                        placeholder="e.g. 160"
                        required
                    >

                </div>


                <!-- EXERCISE ANGINA -->

                <div class="form-group">

                    <label for="exercise_induced_angina">
                        Exercise-Induced Angina
                    </label>

                    <select
                        id="exercise_induced_angina"
                        name="exercise_induced_angina"
                        required
                    >

                        <option value="">
                            Select
                        </option>

                        <option value="Yes">
                            Yes
                        </option>

                        <option value="No">
                            No
                        </option>

                    </select>

                </div>


                <!-- OLDPEAK -->

                <div class="form-group">

                    <label for="oldpeak">
                        Oldpeak
                    </label>

                    <input
                        type="number"
                        step="0.1"
                        id="oldpeak"
                        name="oldpeak"
                        placeholder="e.g. 0.0"
                        required
                    >

                </div>


                <!-- SLOPE -->

                <div class="form-group">

                    <label for="slope">
                        Slope
                    </label>

                    <select
                        id="slope"
                        name="slope"
                        required
                    >

                        <option value="">
                            Select
                        </option>

                        <option value="Upsloping">
                            Upsloping
                        </option>

                        <option value="Flat">
                            Flat
                        </option>

                        <option value="Downsloping">
                            Downsloping
                        </option>

                    </select>

                </div>


                <!-- VESSELS -->

                <div class="form-group">

                    <label for="vessels_colored_by_flourosopy">
                        Vessels Colored by Fluoroscopy
                    </label>

                    <select
                        id="vessels_colored_by_flourosopy"
                        name="vessels_colored_by_flourosopy"
                        required
                    >

                        <option value="">
                            Select
                        </option>

                        <option value="Zero">
                            Zero
                        </option>

                        <option value="One">
                            One
                        </option>

                        <option value="Two">
                            Two
                        </option>

                        <option value="Three">
                            Three
                        </option>

                    </select>

                </div>


                <!-- THALASSEMIA -->

                <div class="form-group">

                    <label for="thalassemia">
                        Thalassemia
                    </label>

                    <select
                        id="thalassemia"
                        name="thalassemia"
                        required
                    >

                        <option value="">
                            Select
                        </option>

                        <option value="Normal">
                            Normal
                        </option>

                        <option value="Fixed Defect">
                            Fixed Defect
                        </option>

                        <option value="Reversable Defect">
                            Reversible Defect
                        </option>

                    </select>

                </div>


            </div>


            <!-- BUTTON -->

            <div class="button-container">

                <button
                    type="submit"
                    class="predict-button"
                >

                    🔍 Analyze Heart Risk

                </button>

            </div>


        </form>

    </div>

</div>


<!-- FOOTER -->

<div class="footer">

    ❤️ Heart Health AI • Machine Learning Risk Prediction

</div>


</body>

</html>
